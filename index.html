<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Visual Engine</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: none;
    }
    
    body {
      background: #000;
      font-family: 'Space Mono', monospace;
    }
    
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    
    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }
    
    button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 10px 16px;
      border-radius: 4px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    
    button:active {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(0.95);
    }
    
    #fps {
      position: fixed;
      top: 10px;
      right: 10px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 11px;
      font-family: 'Space Mono', monospace;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="controls">
    <button id="prev">◄</button>
    <button id="preset-name">EMBERS</button>
    <button id="next">►</button>
  </div>
  <div id="fps"></div>
  
  <script type="module" src="main.js"></script>

</html>
